name: Prettier

on:
  push:
    branches: main
    paths:
      - "**.json"
      - "**.yml"
  # No path filter: this check must report on every pull request so it can be
  # used as a required status check without blocking on a run that never starts.
  pull_request:
    branches: main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Check only — never write. Formatting is fixed in the pull request that
      # introduces it, so nothing pushes to the protected default branch.
      - name: Check formatting
        run: npx --yes prettier --check "*.json"
