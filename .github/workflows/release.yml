name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach assets to (e.g. v1.2.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  VCPKG_ROOT: C:\vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache

jobs:
  release:
    # Only ever run against a version tag — either pushed, or named explicitly
    # via workflow_dispatch. A dispatch with no tag would otherwise build the
    # branch and create a release named after it.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # On a tag push this is the tag itself; on a dispatch it is the tag
          # named in the input, so the build always matches the release.
          ref: ${{ inputs.tag || github.ref_name }}
          submodules: recursive

      # Import the VS developer environment (cl, ninja deps, INCLUDE/LIB)
      # using the runner's vswhere — no third-party action needed.
      - name: Setup MSVC environment
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          & cmd /s /c "`"$vsPath\Common7\Tools\VsDevCmd.bat`" -arch=x64 -host_arch=x64 -no_logo && set" |
            ForEach-Object {
              $name, $value = $_ -split '=', 2
              if ($name -and $value) {
                Add-Content -Path $env:GITHUB_ENV -Value "$name=$value"
              }
            }

      - name: Setup vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "${{ env.VCPKG_DEFAULT_BINARY_CACHE }}" | Out-Null
          cd $env:VCPKG_INSTALLATION_ROOT
          ./bootstrap-vcpkg.bat
          ./vcpkg --version > "${{ github.workspace }}/vcpkg-version.txt"

      - name: Cache vcpkg binaries
        uses: actions/cache@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}/*
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-version.txt') }}

      - name: Configure
        run: cmake --preset build-release-msvc

      - name: Build
        run: cmake --build --preset release-msvc

      - name: Package mod archive
        shell: pwsh
        run: |
          $version = "${{ inputs.tag || github.ref_name }}"
          New-Item -ItemType Directory -Force stage/SKSE/Plugins | Out-Null
          Copy-Item contrib/PluginRelease/skse/plugins/SureOfStealing.dll stage/SKSE/Plugins/
          Copy-Item contrib/PluginRelease/skse/plugins/SureOfStealing.ini stage/SKSE/Plugins/
          Compress-Archive -Path stage/* -DestinationPath "SureOfStealing-$version.zip"
          Compress-Archive -Path contrib/PluginRelease/skse/plugins/SureOfStealing.pdb -DestinationPath "SureOfStealing-$version-pdb.zip"

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ inputs.tag || github.ref_name }}"
          $archive = "SureOfStealing-$version.zip#Mod archive (install with a mod manager)"
          $symbols = "SureOfStealing-$version-pdb.zip#Debug symbols (for crash log symbolication)"

          # The tag may already have a release attached — publishing from the
          # GitHub UI creates the tag that triggers this run. Attach the built
          # assets in that case rather than failing on "already exists".
          gh release view $version *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $version already exists - uploading assets."
            gh release upload $version $archive $symbols --clobber
          } else {
            Write-Host "Creating release $version."
            gh release create $version $archive $symbols --title "Sure of Stealing $version" --generate-notes
          }
