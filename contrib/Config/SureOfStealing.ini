[General]
bChairsAndBenches = true

; Require sneaking in order to sit. Only has an effect while bChairsAndBenches
; above is enabled, which is the master switch for all sitting behaviour.
; false (default) - sitting while standing asks for a second interaction.
; true            - sitting while standing is refused outright. Sneak to sit.
; Useful if you hold activate to loot quickly, since a repeated press satisfies
; the second-interaction check by itself but cannot trigger this one.
bRequireSneakToSit = false

; Require sneaking in order to steal. Applies to stealing only, never to
; sitting, since sitting on a chair is not a crime.
; false (default) - taking an owned item while standing asks for a second
;                   interaction to confirm it.
; true            - taking an owned item while standing is refused outright.
;                   Sneak instead, which takes it on the first interaction.
; Empty containers are unaffected either way, having nothing to steal.
bRequireSneakToSteal = false

; Require a second interaction even while sneaking. Unlike bRequireSneakToSteal
; this also covers chairs and benches, which are otherwise sat on with no
; confirmation at all whenever the player happens to be sneaking.
; false (default) - sneaking takes the item on the first interaction.
; true            - sneaking asks for a second interaction too, so nothing is
;                   taken, and no chair is sat on, without confirming.
bDoubleTapWhileSneaking = false

[Log]
Debug = true
