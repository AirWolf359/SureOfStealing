[General]
bChairsAndBenches = true

; Require sneaking in order to steal.
; false (default) - taking an owned item while standing asks for a second
;                   interaction to confirm it.
; true            - taking an owned item while standing is refused outright.
;                   Sneak instead, which takes it on the first interaction.
; Empty containers are unaffected either way, having nothing to steal.
bRequireSneak = false

; Require a second interaction even while sneaking.
; false (default) - sneaking takes the item on the first interaction.
; true            - sneaking asks for a second interaction too, so nothing is
;                   taken, and no chair is sat on, without confirming.
bDoubleTapWhileSneaking = false

[Log]
Debug = true
