; Require sneaking in order to steal.
; false (default) - taking an owned item while standing asks for a second
;                   interaction to confirm it.
; true            - taking an owned item while standing is refused outright.
;                   Sneak instead, which takes it on the first interaction.
; Empty containers are unaffected either way, having nothing to steal.
bRequireSneak = false

